<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VibeCAD</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:,">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<header>
  <span class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.5 5v10L12 22l-8.5-5V7z"/><path d="M12 12l8.5-5M12 12v10M12 12L3.5 7"/></svg>VibeCAD</span>
  <select id="partSelect" title="Open a part"></select>
  <button id="newBtn" class="hb" data-icon="new" title="New part">New</button>
  <span class="sep"></span>
  <button id="undoBtn" class="hb" data-icon="undo" title="Undo (Ctrl/Cmd+Z)">Undo</button>
  <button id="redoBtn" class="hb" data-icon="redo" title="Redo (Ctrl/Cmd+Shift+Z)">Redo</button>
  <span class="sep"></span>
  <button id="historyBtn" class="hb" data-icon="history" title="Every change to this part">History</button>
  <button id="rendersBtn" class="hb" data-icon="renders" title="The rendered views the agent sees">Renders</button>
  <span id="partStatus" class="status"></span>
  <span class="grow"></span>
  <span id="conn" class="conn">connecting</span>
</header>

<main>
  <section id="left">
    <div class="panel-title">Feature tree <span id="partName" class="muted small"></span></div>
    <div id="treePane" class="pane"><ol id="tree"></ol></div>
    <div id="splitter" class="splitter" title="Drag to give the tree more or less room"></div>
    <div id="lowerPane" class="pane">
      <div class="panel-title">Parameters</div>
      <table id="params"><colgroup><col class="n"><col><col class="v"></colgroup><tbody></tbody></table>
      <div class="panel-title">Selected <span id="selName" class="muted"></span></div>
      <div id="details" class="muted small">Click a feature in the tree or a face in the view.</div>
    </div>
  </section>

  <section id="center">
    <div id="viewer"></div>
    <div id="refHint" hidden>Click a face or edge to reference it · Esc cancels</div>
    <div id="rebuild" class="rebuild" hidden><span class="spin"></span><span id="rebuildText">Rebuilding…</span></div>
    <div id="edgeEdit" class="edgeedit" hidden><span id="edgeEditText"></span>
      <button id="edgeEditDone" class="go">Done</button><button id="edgeEditCancel">Cancel</button></div>
    <div id="modelTools" class="ribbon">
      <div class="rgroup"><button id="newSketchBtn" class="rb" data-icon="sketch" data-label="Sketch" title="New sketch: on a datum plane, or on the face you clicked"></button></div>
      <div class="rgroup"><button id="extrude3dBtn" class="rb" data-icon="extrude" data-label="Extrude"></button>
        <button id="revolve3dBtn" class="rb" data-icon="revolve" data-label="Revolve"></button>
        <button id="holeBtn" class="rb" data-icon="hole" data-label="Hole"></button></div>
      <div class="rgroup"><button id="filletBtn" class="rb" data-icon="fillet" data-label="Fillet" data-kind="Fillet"></button>
        <button id="chamferBtn" class="rb" data-icon="chamfer" data-label="Chamfer" data-kind="Chamfer"></button>
        <button id="shellBtn" class="rb" data-icon="shell" data-label="Shell"></button></div>
      <div class="rgroup"><button id="patternBtn" class="rb" data-icon="pattern" data-label="Pattern"></button>
        <button id="mirrorBtn" class="rb" data-icon="mirror" data-label="Mirror"></button></div>
      <div class="rgroup"><button id="importBtn" class="rb" data-icon="import" data-label="Import" title="Import a STEP, IGES, BREP or STL file: as the part's base solid, added or cut, or as a reference body to design around"></button></div>
      <div class="rgroup"><button id="measureBtn" class="rb" data-icon="measure" data-label="Measure" title="Measure: click faces, edges or points (M)"></button>
        <button id="sectionBtn" class="rb" data-icon="section" data-label="Section" title="Section view: cut the view with a plane"></button></div>
      <div class="rgroup"><button id="exportBtn" class="rb" data-icon="export" data-label="Export" title="Download the part as STEP, STL, 3MF, BREP or glTF"></button></div>
      <input id="importFile" type="file" accept=".step,.stp,.iges,.igs,.brep,.brp,.stl" hidden>
    </div>
    <div class="vtools left viewbar">
      <button data-view="iso" title="Isometric view">Iso</button><button data-view="front" title="Front view (looking along +Y)">Front</button>
      <button data-view="top" title="Top view">Top</button><button data-view="right" title="Right view">Right</button>
      <button id="fitBtn" title="Fit the part in view (F)">Fit</button>
      <span class="vsep"></span>
      <button id="projBtn" title="Switch between orthographic and perspective">Orthographic</button>
    </div>
    <svg id="gizmo" class="gizmo" viewBox="-50 -50 100 100" aria-label="View orientation: click an axis to look along it"></svg>
    <div id="measurePanel" class="floatpanel" hidden></div>
    <div id="sectionPanel" class="floatpanel" hidden></div>
    <div id="sketchBar" class="sketchbar" hidden>
      <div class="skhead"><span>Sketch <b id="sketchName"></b> <span id="sketchInfo" class="muted"></span></span>
        <span class="skacts"><button id="extrudeBtn" class="ico" data-icon="extrude" title="Extrude this sketch's closed profiles: add, cut or a new body"></button>
        <button id="revolveBtn" class="ico" data-icon="revolve" title="Revolve this sketch's closed profiles about a line"></button>
        <button id="exitSketch" class="ico" data-icon="finish" title="Finish sketch (Esc)"></button></span></div>
    </div>
    <div id="sketchTools" class="sktools" hidden></div>
    <div id="sketchHint" class="skhint" hidden></div>
    <div id="labels"></div>
    <div id="boxSel" class="boxsel" hidden></div>
    <div id="newMenu" class="popmenu" hidden></div>
    <div id="featMenu" class="popmenu" hidden></div>
    <div id="dimEdit" class="dimedit" hidden><span class="what"></span><input spellcheck="false" autocomplete="off"><span class="keys">Enter · Esc</span></div>
    <div id="rollbackNote" class="rollnote" hidden></div>
  </section>

  <section id="right">
    <div class="panel-title">Agent
      <select id="model" class="small" title="Model: switch any time; the conversation continues">
        <option value="sonnet">Sonnet</option><option value="opus">Opus</option><option value="haiku">Haiku</option>
      </select>
      <select id="effort" class="small" title="Thinking effort: lower is faster">
        <option value="low">effort low</option><option value="medium">effort medium</option>
        <option value="high">effort high</option><option value="default">effort default</option>
      </select>
      <span class="grow"></span><button id="resetBtn" class="small" title="Start a new conversation">New chat</button></div>
    <div id="metrics" class="metrics"></div>
    <div id="log"></div>
    <form id="promptForm">
      <div id="attachList" class="attachlist" hidden></div>
      <div id="prompt" contenteditable="true" role="textbox" aria-multiline="true"
        data-placeholder="Describe a part, or a change to the open part. Enter to send, Shift+Enter for a new line. Reference puts a face, edge or sketch entity into the message."></div>
      <div class="row">
        <button type="button" id="refBtn" class="refbtn" data-icon="reference" title="Reference: click this, then click a face or edge in the view (or a sketch entity) to put it into your message"> Reference</button>
        <button type="button" id="attachBtn" class="refbtn" title="Attach images, PDFs or other files for the agent (or drop or paste them into the message)">📎</button>
        <input type="file" id="attachInput" multiple hidden>
        <label class="small"><input type="checkbox" id="scope"> Limit edits to the selected feature</label>
        <span class="grow"></span>
        <button type="button" id="stopBtn" disabled>Stop</button>
        <button type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </section>
</main>

<dialog id="historyDlg"><div class="dlg-head"><b>History</b><form method="dialog"><button>Close</button></form></div><ol id="history"></ol></dialog>
<dialog id="rendersDlg"><div class="dlg-head"><b>Renders</b> <span class="muted small">(what the agent sees; selected feature in orange)</span><form method="dialog"><button>Close</button></form></div><img id="rendersImg" alt=""></dialog>
<dialog id="imgDialog"><img id="imgBig" alt=""><form method="dialog"><button>Close</button></form></dialog>
<script type="module" src="/static/app.js"></script>
</body>
</html>
