[project]
name = "vibecad"
version = "0.0.1"
description = "AI-assisted parametric B-rep CAD with a sketch-driven feature-tree IR"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "build123d>=0.13",
    "planegcs>=0.8", # FreeCAD's sketch solver; builds from source on macOS (see scripts/setup_mac.sh)
    "ocp_viewer>=1.1", # standalone 3D viewer: `uv run python -m ocp_viewer`
    "pydantic>=2.13.5",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "mcp>=2.2",
    "pillow>=12.2.0",
    "claude-agent-sdk>=0.2.159",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
vibecad = "vibecad.cli:main"
vibecad-mcp = "vibecad.mcp_server:main"
vibecad-bench = "vibecad.bench:main"
vibecad-app = "vibecad.app:main"
vibecad-trace = "vibecad.trace:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/vibecad"]

[tool.pytest.ini_options]
testpaths = ["tests"]
